<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Store - Key Shop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h2>🔥 Super Store Key Shop</h2>
            <p class="subtitle">ជ្រើសរើសប្រភេទ Key ហ្គេមដែលអ្នកចង់ទិញ៖</p>
        </header>

        <div class="product-list" id="product-list">
            <div class="card" data-name="Roblox Mod (1 ថ្ងៃ)" data-price="1.50" onclick="selectProduct(this)">
                <div class="info">
                    <h3>🤖 Roblox Mod (1 ថ្ងៃ)</h3>
                    <p class="desc">Auto Farm, ESP, Speed</p>
                </div>
                <div class="price">$1.50</div>
            </div>

            <div class="card" data-name="Roblox Mod (7 ថ្ងៃ)" data-price="5.00" onclick="selectProduct(this)">
                <div class="info">
                    <h3>🤖 Roblox Mod (7 ថ្ងៃ)</h3>
                    <p class="desc">Full Features VIP</p>
                </div>
                <div class="price">$5.00</div>
            </div>

            <div class="card" data-name="Free Fire VIP Key (30 ថ្ងៃ)" data-price="3.00" onclick="selectProduct(this)">
                <div class="info">
                    <h3>🔥 Free Fire VIP Key</h3>
                    <p class="desc">Aimbot, Wallhack, Anti-Ban</p>
                </div>
                <div class="price">$3.00</div>
            </div>
        </div>

        <div id="selected-info" class="selected-box hidden">
            <h4>🛒 ព័ត៌មានការទិញ</h4>
            <p>ទំនិញ: <span id="item-name">-</span></p>
            <p>តម្លៃ: <span id="item-price">$0.00</span></p>
            <button id="buy-btn" onclick="sendDataToBot()">បង់ប្រាក់ / ទទួល Key</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
